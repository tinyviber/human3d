name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Docs link check
        run: npm run docs:check
      - run: npx tsc -b
      - name: Published contract (schemas, OpenAPI, golden package)
        run: npm run spec:check
      - run: npm test
      - run: npm run build
  dynamics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-dynamics.txt
      - run: pip install -r scripts/requirements-dynamics.txt
      - name: Action specs and MyoSim archive
        run: npm run dynamics:validate
      - name: Exported physics records
        run: npm run dynamics:test
