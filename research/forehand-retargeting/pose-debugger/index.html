<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Pose Compare</title>
<style>
  :root{font:14px/1.5 system-ui,-apple-system,sans-serif;color:#17233a;background:#f3f6fa}
  body{margin:0;padding:22px;max-width:1500px;margin-inline:auto}
  h1{font-size:22px;margin:0 0 4px}p{margin:0;color:#61708a}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
  fieldset{border:1px solid #d7deea;background:#fff;border-radius:12px;padding:14px}
  legend{font-weight:700;padding:0 6px}label{display:block;margin:8px 0 4px;color:#52617a}
  input,button{font:inherit}input[type=file]{max-width:100%}input[type=number]{width:90px;padding:5px}
  button{border:0;border-radius:8px;background:#155eef;color:#fff;padding:9px 15px;cursor:pointer;font-weight:650}
  .actions{display:flex;align-items:center;gap:12px;margin:10px 0 16px}.status{color:#52617a}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pane{background:#fff;border:1px solid #d7deea;border-radius:12px;padding:12px;min-width:0}
  .pane h2{font-size:15px;margin:0 0 8px}.pane canvas{display:block;width:100%;height:auto;background:#111;max-height:72vh;object-fit:contain}
  #score{white-space:pre-wrap;background:#fff;border:1px solid #d7deea;border-radius:12px;margin-top:14px;padding:14px;font:13px/1.55 ui-monospace,monospace}
  .hint{font-size:12px;margin-top:8px}
  @media(max-width:820px){.controls,.panes{grid-template-columns:1fr}body{padding:12px}}
</style>
</head>
<body>
<h1>本地人体姿态对比</h1>
<p>MediaPipe Pose Landmarker Lite · 推理在本机浏览器完成 · 视频和截图使用同一模型</p>
<div class="controls">
  <fieldset><legend>参考视频 / 图片</legend>
    <label for="referenceFile">本地参考素材</label><input id="referenceFile" type="file" accept="video/*,image/*">
    <label for="referenceTime">视频取帧时间（秒；图片忽略）</label><input id="referenceTime" type="number" value="5" min="0" step="0.04">
  </fieldset>
  <fieldset><legend>h3d 渲染截图</legend>
    <label for="generatedFile">本地 h3d 图片</label><input id="generatedFile" type="file" accept="image/*">
    <div class="hint">建议把 h3d 相机调到和参考视频相同的方向，并尽量让人体高度占画面比例接近。</div>
  </fieldset>
</div>
<div class="actions"><button id="analyze">检测并对比</button><span id="status" class="status">正在加载本地模型…</span></div>
<div class="panes">
  <section class="pane"><h2>参考帧 · 绿点 / 骨架</h2><canvas id="referenceCanvas"></canvas></section>
  <section class="pane"><h2>h3d 截图 · 青点 / 骨架</h2><canvas id="generatedCanvas"></canvas></section>
</div>
<pre id="score">等待输入。</pre>
<script type="module" src="/app.mjs"></script>
</body>
</html>
